version: 2

seeds:
  - name: config_param
    description: "Seeded source data for config param."
    columns:
      - name: ParamKey
        description: "Source column ParamKey from `seeds/config_param.csv`."
        tests:
          - not_null
          - unique
      - name: ParamValue
        description: "Source column ParamValue from `seeds/config_param.csv`."
      - name: ParamType
        description: "Source column ParamType from `seeds/config_param.csv`."
      - name: Description
        description: "Source column Description from `seeds/config_param.csv`."

  - name: customer
    description: "Seeded source data for customer."
    columns:
      - name: CustomerId
        description: "Source column CustomerId from `seeds/customer.csv`."
        tests:
          - not_null
          - unique
      - name: CustomerNo
        description: "Source column CustomerNo from `seeds/customer.csv`."
      - name: FirstName
        description: "Source column FirstName from `seeds/customer.csv`."
      - name: LastName
        description: "Source column LastName from `seeds/customer.csv`."
      - name: Email
        description: "Source column Email from `seeds/customer.csv`."
      - name: Phone
        description: "Source column Phone from `seeds/customer.csv`."
      - name: CountryCode
        description: "Source column CountryCode from `seeds/customer.csv`."
      - name: Status
        description: "Source column Status from `seeds/customer.csv`."

  - name: customer_address
    description: "Seeded source data for customer address."
