version: 2

unit_tests:
  - name: customer_ltv_preserves_segment_precedence_and_recency_boundary
    description: Tests the 12000 USD VIP threshold, VIP-before-lapsed precedence, strict 365-day boundary, excluded statuses, and multi-order averages.
    model: rpt_customer_ltv
    overrides:
      vars:
        ltv_as_of_date: '2025-01-01'
    given:
      - input: ref('fct_orders')
        rows:
          - {order_id: 1, customer_id: 1, order_date: '2024-01-01', status: CONFIRMED, grand_total: 6000}
          - {order_id: 2, customer_id: 2, order_date: '2024-01-01', status: PAID, grand_total: 100}
          - {order_id: 3, customer_id: 3, order_date: '2024-01-02', status: SHIPPED, grand_total: 100}
          - {order_id: 4, customer_id: 4, order_date: '2024-12-01', status: COMPLETED, grand_total: 100}
          - {order_id: 5, customer_id: 4, order_date: '2024-12-15', status: CONFIRMED, grand_total: 300}
          - {order_id: 6, customer_id: 5, order_date: '2024-12-01', status: CANCELLED, grand_total: 20000}
          - {order_id: 7, customer_id: 6, order_date: '2024-12-01', status: NEW, grand_total: 20000}
          - {order_id: 8, customer_id: 7, order_date: '2024-12-01', status: CONFIRMED, grand_total: 11999.99}
      - input: ref('int_order_usd_rates')
        rows:
          - {order_id: 1, usd_rate: 2}
          - {order_id: 2, usd_rate: 1}
          - {order_id: 3, usd_rate: 1}
          - {order_id: 4, usd_rate: 1}
          - {order_id: 5, usd_rate: 1}
          - {order_id: 6, usd_rate: 1}
          - {order_id: 7, usd_rate: 1}
          - {order_id: 8, usd_rate: 1}
    expect:
      rows:
        - {customer_id: 1, first_order_date: '2024-01-01', last_order_date: '2024-01-01', order_count: 1, total_net_spend: 12000, avg_order_value: 12000, ltv_score: 6000, segment: VIP}
        - {customer_id: 2, first_order_date: '2024-01-01', last_order_date: '2024-01-01', order_count: 1, total_net_spend: 100, avg_order_value: 100, ltv_score: 50, segment: LAPSED}
        - {customer_id: 3, first_order_date: '2024-01-02', last_order_date: '2024-01-02', order_count: 1, total_net_spend: 100, avg_order_value: 100, ltv_score: 100, segment: NEW}
        - {customer_id: 4, first_order_date: '2024-12-01', last_order_date: '2024-12-15', order_count: 2, total_net_spend: 400, avg_order_value: 200, ltv_score: 400, segment: REGULAR}
        - {customer_id: 7, first_order_date: '2024-12-01', last_order_date: '2024-12-01', order_count: 1, total_net_spend: 11999.99, avg_order_value: 11999.99, ltv_score: 11999.99, segment: NEW}
